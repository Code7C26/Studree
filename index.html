<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studree</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        header{
            background-color: #4a6cf7;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container{
            padding: 20px;
        }

        .materia{
            background-color: white;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 10px;
        }

        button{
            background-color: #4a6cf7;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover{
            opacity: 0.9;
        }
    </style>
</head>

<body>

    <header>
        <h1>📚 Studree</h1>
        <p>Tu carpeta digital para organizar materias y apuntes</p>
    </header>

    <div class="container">

        <div class="materia">
            <h2>Programación</h2>
            <p>Apuntes y trabajos prácticos.</p>
            <button>Ver archivos</button>
        </div>

        <div class="materia">
            <h2>Matemática</h2>
            <p>Ejercicios, fórmulas y actividades.</p>
            <button>Ver archivos</button>
        </div>

        <div class="materia">
            <h2>Inglés</h2>
            <p>Vocabulary, grammar y tareas.</p>
            <button>Ver archivos</button>
        </div>

    </div>

</body>
</html>
